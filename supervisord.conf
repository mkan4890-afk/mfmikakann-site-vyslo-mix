[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:music]
command=uvicorn main:app --host 127.0.0.1 --port 8001 --proxy-headers --forwarded-allow-ips=*
directory=/app/apps/music
autorestart=true
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:tube]
command=uvicorn main:app --host 127.0.0.1 --port 8002 --proxy-headers --forwarded-allow-ips=*
directory=/app/apps/tube
autorestart=true
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:chat]
command=node .output/server/index.mjs
directory=/app/apps/chat
environment=PORT="8003",HOST="0.0.0.0"
autorestart=true
startretries=20
stdout_logfile=/tmp/chat.log
stdout_logfile_maxbytes=1048576
redirect_stderr=true

[program:cloudmoon]
command=node /app/static-server.js
environment=PORT="8004",STATIC_DIR="/app/apps/cloudmoon"
autorestart=true
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:utopia]
command=node /app/static-server.js
environment=PORT="8005",STATIC_DIR="/app/apps/utopia",SPA_FALLBACK="1",SW_FILE="graph.js"
autorestart=true
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:gateway]
command=node gateway.js
directory=/app
autorestart=true
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
