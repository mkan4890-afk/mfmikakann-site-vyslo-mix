<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0a17" />
  <title>Vyslo Music</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/static/img/vyslo-icon-192.png" />
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Outfit:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="/static/css/app.css?v=2.7.3" />
  <script>(function(){try{var t=localStorage.getItem('vm-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
  <div class="app">
      <header class="top">
        <button class="icon-btn only-mobile" id="menuBtn" aria-label="メニュー">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <a href="/" class="top-brand only-desktop" data-link aria-label="ホーム" title="Vyslo Music"><img src="/static/img/favicon.svg" alt="Vyslo Music" width="32" height="32" /></a>
        <button class="icon-btn only-desktop" id="backBtn" aria-label="戻る">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button class="icon-btn only-desktop" id="fwdBtn" aria-label="進む">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <div class="top-center">
        <a href="/" class="top-home only-desktop" data-link data-nav="home" aria-label="ホーム" title="ホーム">
          <svg class="o" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
          <svg class="f" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.6 2.4 10.6a1 1 0 0 0-.4.8V20a2 2 0 0 0 2 2h5v-7h6v7h5a2 2 0 0 0 2-2v-8.6a1 1 0 0 0-.4-.8z"/></svg>
        </a>
        <form class="search-box" id="searchForm" autocomplete="off">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="searchInput" type="search" placeholder="曲名・アーティスト・SpotifyのURL" enterkeyhint="search" />
          <div class="suggest" id="suggest" hidden></div>
        </form>
        </div>
        <div class="top-right">
          <a href="/history" class="icon-btn top-ico only-desktop" data-link data-nav="history" aria-label="再生履歴" title="再生履歴"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg></a>
          <a href="/settings" class="icon-btn top-ico only-desktop" data-link data-nav="settings" aria-label="設定" title="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
          <div class="top-right-x" id="topRight"></div>
        </div>
      </header>
    <!-- Sidebar -->
    <aside class="side" id="side">
      <div class="side-card side-navcard">
        <a href="/" class="brand" data-link>
          <span class="brand-mark"><img src="/static/img/favicon.svg" alt="" width="38" height="38" /></span>
          <span class="brand-text"><b class="grad-text">Vyslo</b> Music</span>
        </a>
        <nav class="side-nav">
          <a href="/" data-link data-nav="home" class="side-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span><b>ホーム</b></span>
          </a>
          <a href="/search" data-link data-nav="search" class="side-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <span><b>検索</b></span>
          </a>
        </nav>
      </div>
      <div class="side-card side-lib">
        <div class="lib-head">
          <button class="lib-title" id="sideCollapse" title="マイライブラリを折りたたむ">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></svg>
            <b>マイライブラリ</b>
          </button>
          <div class="lib-head-r">
            <button class="lib-create" id="sideCreate" aria-label="プレイリストを作成" title="プレイリストを作成">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>作成</span>
            </button>
            <button class="icon-btn sm lib-expand" id="sideExpand" aria-label="マイライブラリを広げる" title="マイライブラリを広げる">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
            </button>
          </div>
        </div>
        <div class="lib-chipwrap">
          <button class="chip-arrow l" id="chipL" aria-label="左へ" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
          <div class="lib-chips" id="sideChips"></div>
          <button class="chip-arrow r" id="chipR" aria-label="右へ" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
        </div>
        <div class="lib-tools">
          <div class="lib-search" id="sideSearchBox">
            <button class="lib-search-btn" id="sideSearchBtn" aria-label="ライブラリ内を検索" title="ライブラリ内を検索"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></button>
            <input id="sideFilter" type="search" placeholder="ライブラリ内を検索" />
          </div>
          <button class="lib-sort" id="sideSort" title="並べ替え"><span id="sideSortName">最近</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h6"/></svg></button>
        </div>
        <div class="lib-list" id="sideLib"></div>
        <div class="side-foot only-mobile-flex">
          <a href="/history" data-link data-nav="history">再生履歴</a>
          <a href="/settings" data-link data-nav="settings">設定</a>
          <small class="muted">無料・登録不要 / データはこのブラウザに保存</small>
        </div>
      </div>
      <div class="side-resize" id="sideResize" title="ドラッグで幅を変更 / ダブルクリックで折りたたみ"></div>
    </aside>

    <!-- Main -->
    <div class="main">

      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <!-- Queue drawer -->
  <aside class="drawer" id="queueDrawer" hidden>
    <div class="drawer-head">
      <h3>再生キュー</h3>
      <div class="row gap-s">
        <button class="btn-ghost sm" id="queueClear">クリア</button>
        <button class="icon-btn" id="queueClose" aria-label="閉じる">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
    <div class="drawer-body" id="queueList"></div>
  </aside>

  <!-- Lyrics panel -->
  <section class="lyr" id="lyrPanel" hidden aria-label="歌詞">
    <div class="lyr-bg" id="lyrBg"></div>
    <div class="lyr-head">
      <img class="lyr-art" id="lyrArt" alt="" />
      <div class="grow ellipsis"><b id="lyrTitle" class="ellipsis"></b><small id="lyrSub" class="ellipsis"></small></div>
      <button class="icon-btn" id="lyrClose" aria-label="閉じる">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="lyr-off" id="lyrOff" hidden>
      <span class="lyr-off-label">歌詞のタイミング</span>
      <button type="button" class="lyr-off-btn" data-off="-500" title="歌詞を0.5秒早くする">−0.5秒</button>
      <span class="lyr-off-val" id="lyrOffVal">±0.0秒</span>
      <button type="button" class="lyr-off-btn" data-off="500" title="歌詞を0.5秒遅くする">+0.5秒</button>
      <button type="button" class="lyr-off-btn reset" data-off="0" title="元に戻す">リセット</button>
      <span class="lyr-auto" id="lyrAuto" hidden></span>
    </div>
    <div class="lyr-body" id="lyrBody"></div>
    <button class="lyr-resync" id="lyrResync" hidden>歌詞を同期</button>
  </section>

  <!-- Player bar -->
  <footer class="player" id="player">
    <div class="pl-now">
      <img class="pl-art" id="plArt" alt="" />
      <div class="pl-meta">
        <a class="pl-title" id="plTitle" data-link>再生していません</a>
        <div class="pl-sub" id="plSub">曲を選んで再生しましょう</div>
      </div>
      <button class="icon-btn heart" id="plLike" aria-label="お気に入り" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>
      </button>
    </div>
    <div class="pl-center">
      <div class="pl-ctrls">
        <button class="icon-btn sm" id="plShuffle" aria-label="シャッフル" title="シャッフル">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="m4 4 5 5"/></svg>
        </button>
        <button class="icon-btn" id="plPrev" aria-label="前へ">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <button class="play-btn" id="plPlay" aria-label="再生/一時停止">
          <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
        </button>
        <button class="icon-btn" id="plNext" aria-label="次へ">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
        </button>
        <button class="icon-btn sm" id="plRepeat" aria-label="リピート" title="リピート">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
          <span class="rep-one" hidden>1</span>
        </button>
      </div>
      <div class="pl-seek">
        <span id="plCur">0:00</span>
        <input type="range" id="plSeek" min="0" max="1000" value="0" step="1" aria-label="シーク" />
        <span id="plDur">0:00</span>
      </div>
    </div>
    <div class="pl-right">
      <span class="engine-badge" id="plEngine" title="再生方式">—</span>
      <div class="pl-vol" id="plVolWrap">
        <button class="icon-btn sm vol-btn" id="plMute" type="button" aria-label="ミュート" title="ミュート (M)">
          <svg class="v-hi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>
          <svg class="v-lo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
          <svg class="v-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>
        </button>
        <div class="vol-pop" id="plVolPop">
          <input type="range" id="plVol" min="0" max="100" value="80" step="1" aria-label="音量" />
          <span class="vol-num" id="plVolNum">80</span>
        </div>
      </div>
      <button class="icon-btn" id="plLyrics" aria-label="歌詞" title="歌詞">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/></svg>
      </button>
      <button class="icon-btn" id="plQueue" aria-label="キュー" title="再生キュー">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h13M3 12h13M3 18h9"/><path d="M19 15v6l4-3z" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn" id="plEmbedToggle" aria-label="Spotifyプレーヤー表示" title="Spotifyプレーヤーを表示/隠す">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 14h18"/></svg>
      </button>
    </div>
    <div class="pl-embed" id="plEmbedWrap">
      <div id="embedHost"></div>
    </div>
  </footer>

  <!-- Mobile bottom nav -->
  <nav class="mnav">
    <a href="/" data-link data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>ホーム</span></a>
    <a href="/search" data-link data-nav="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><span>検索</span></a>
    <a href="/library" data-link data-nav="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></svg><span>ライブラリ</span></a>
    <a href="/settings" data-link data-nav="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>設定</span></a>
  </nav>

  <div class="modal-wrap" id="modal" hidden><div class="modal" role="dialog" aria-modal="true" id="modalBox"></div></div>
  <div class="scrim" id="scrim" hidden></div>
  <div class="menu" id="ctxMenu" hidden></div>
  <div class="toasts" id="toasts"></div>

  <script src="/static/js/player.js?v=2.7.3"></script>
  <script src="/static/js/app.js?v=2.7.3"></script>
</body>
</html>
