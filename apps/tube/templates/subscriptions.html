{% extends "base.html" %}
{% block title %}登録チャンネル — Vyslo Tube{% endblock %}
{% block body_class %}page-subscriptions{% endblock %}
{% set active = "subs" %}
{% block content %}
<main class="lib-main">
    <div class="lib-header">
      <h1 class="lib-title">登録チャンネル</h1>
    </div>

    <!-- チャンネルアイコン横一列 -->
    <div class="subs-channels-row-wrap" id="subsChannelsRowWrap" hidden>
      <div class="subs-channels-row" id="subsChannelsRow"></div>
      <button class="subs-channels-more" id="subsMoreBtn" hidden>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polyline points="6 9 12 15 18 9"/></svg>
        さらに表示
      </button>
    </div>

    <!-- 縦一覧 (さらに表示で展開) -->
    <div class="subs-channels-list" id="subsChannelsList" hidden></div>

    <!-- 登録チャンネルの動画 -->
    <div class="subs-videos-section">
      <h2 class="subs-videos-title">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><rect x="2" y="7" width="20" height="14" rx="2.5"/><polyline points="17 2 12 7 7 2"/></svg>
        登録チャンネルの動画
      </h2>
      <div id="subsVideoGrid" class="video-grid">
        <div class="loading-state">
          <div class="spinner"></div>
          <p>動画を取得中…</p>
        </div>
      </div>
    </div>

    <div class="lib-empty" id="subsEmpty" hidden>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <p>まだチャンネルを登録していません</p>
      <p class="lib-empty-hint">気になるチャンネルで「登録」を押すとここに並びます</p>
    </div>
</main>
{% endblock %}
