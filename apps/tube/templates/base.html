  <script>(function(){var r=document.documentElement;r.setAttribute('data-ui','vyslo');try{r.setAttribute('data-theme',localStorage.getItem('vy-theme')||'dark');}catch(e){r.setAttribute('data-theme','dark')}var c='0';try{c=localStorage.getItem('vy-side-collapsed')||'0'}catch(e){}var m=/^\/(watch|shorts)/.test(location.pathname);if(m)r.classList.add('vy-media');if(window.innerWidth>=1280&&!m&&c!=='1')r.classList.add('vy-side-open');r.classList.add('vy-no-anim');setTimeout(function(){r.classList.remove('vy-no-anim')},350);})();</script>

</head>
<body class="{% block body_class %}{% endblock %}">
  <!-- Sidebar overlay -->

  <!-- Left sidebar (Vyslo style) -->
  <aside id="appSidebar" class="app-sidebar" data-active="{{ active | default('') }}">
    <nav class="sidebar-nav">
      <a href="/" class="sidebar-nav-link vy-side-item" data-nav="home" data-mini="ホーム" title="ホーム">
        <span class="vy-side-ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
        <span class="vy-side-txt"><b>ホーム</b><small>あなた向けの動画</small></span>
      </a>
      <a href="/shorts" class="sidebar-nav-link vy-side-item" data-nav="shorts" data-mini="ショート" title="ショート">
        <span class="vy-side-ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10.5 9.5v5l4-2.5z" fill="currentColor"/></svg></span>
        <span class="vy-side-txt"><b>ショート</b><small>縦スクロールでショート</small></span>
      </a>
      <a href="/subscriptions" class="sidebar-nav-link vy-side-item" data-nav="subs" data-mini="登録" title="登録チャンネル">
        <span class="vy-side-ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><rect x="2" y="7" width="20" height="14" rx="2.5"/><polyline points="17 2 12 7 7 2"/></svg></span>
        <span class="vy-side-txt"><b>登録チャンネル</b><small>登録したチャンネル</small></span>
      </a>
      <a href="/trending" class="sidebar-nav-link vy-side-item" data-nav="trending" data-mini="急上昇" title="急上昇">
        <span class="vy-side-ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg></span>
        <span class="vy-side-txt"><b>急上昇</b><small>いま話題の動画</small></span>
      </a>
      <div class="vy-side-sep"></div>
      <div class="vy-side-label">ライブラリ</div>
      <a href="/library" class="sidebar-nav-link vy-side-item" data-nav="library" data-mini="ライブラリ" title="ライブラリ">
        <span class="vy-side-ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
        <span class="vy-side-txt"><b>ライブラリ</b><small>再生リスト・お気に入り</small></span>
      </a>
      <a href="/history" class="sidebar-nav-link vy-side-item" data-nav="history" data-mini="履歴" title="履歴">
        <span class="vy-side-ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg></span>
        <span class="vy-side-txt"><b>履歴</b><small>視聴した動画</small></span>
      </a>
      <div class="vy-side-subs" id="vySideSubs" hidden></div>

    </nav>
    <div class="vy-side-foot">© Vyslo Tube</div>
  </aside>

  <header>
    <div class="header-inner">
      <div class="vy-top-left">
        <button id="hamburgerBtn" class="hamburger-btn" aria-label="メニュー" title="メニュー" aria-expanded="false">
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </button>
        <a href="/" class="logo" title="Vyslo Tube ホーム"><img class="vy-logo-img" src="/static/img/vyslo-icon-128.png" alt="Vyslo Tube" width="32" height="32" /><span class="logo-inv">Vyslo</span><span class="logo-tube">Tube</span></a>
      </div>
      <div class="search-wrapper">
        <form class="search-form" id="searchForm" role="search">
          <span class="vy-search-ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
          <input type="text" id="searchInput" class="search-input" placeholder="検索" autocomplete="off" enterkeyhint="search" />
          <button type="button" class="vy-search-clear" id="searchClearBtn" aria-label="入力を消す" hidden><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
          <button type="submit" class="search-btn" aria-label="検索" title="検索"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
        </form>
        <ul id="suggestions" class="suggestions-list" hidden></ul>
      </div>
      <nav class="header-nav">
        <button id="hardRefreshBtn" class="vy-hbtn header-refresh-btn" title="キャッシュを消して読み込み直す" aria-label="更新"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="19" height="19"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button>
        <button id="vyThemeBtn" class="vy-hbtn vy-theme-btn" type="button" aria-label="テーマ切り替え" title="テーマ切り替え">
          <span class="vy-theme-ic vy-theme-ic-dark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
          <span class="vy-theme-ic vy-theme-ic-light"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><circle cx="12" cy="12" r="4.5"/><line x1="12" y1="1.5" x2="12" y2="3.5"/><line x1="12" y1="20.5" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="3.5" y2="12"/><line x1="20.5" y1="12" x2="22.5" y2="12"/><line x1="4.6" y1="4.6" x2="6" y2="6"/><line x1="18" y1="18" x2="19.4" y2="19.4"/><line x1="4.6" y1="19.4" x2="6" y2="18"/><line x1="18" y1="6" x2="19.4" y2="4.6"/></svg></span>
        </button>
      </nav>
    </div>
  </header>
  <div class="vy-side-backdrop" id="vySideBackdrop"></div>


  {% block content %}{% endblock %}

  <nav class="vy-bottom-nav" aria-label="メインメニュー">
    <a href="/" data-bnav="home"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>ホーム</span></a>
    <a href="/shorts" data-bnav="shorts"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10.5 9.5v5l4-2.5z" fill="currentColor"/></svg><span>ショート</span></a>
    <a href="/subscriptions" data-bnav="subs"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2.5"/><polyline points="17 2 12 7 7 2"/></svg><span>登録チャンネル</span></a>
    <a href="/history" data-bnav="history"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg><span>履歴</span></a>
    <a href="/library" data-bnav="library"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span>ライブラリ</span></a>
  </nav>

  <footer class="vy-foot">
    <span>© Vyslo Tube — 広告なし・軽量・高速</span>

  </footer>

  <script>
    initHeaderSearch();


    (function() {
      const btn = document.getElementById('hardRefreshBtn');
      if (!btn) return;
      btn.addEventListener('click', async function() {
        btn.classList.add('spinning');
        try {
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k)));
          }
          sessionStorage.clear();
        } catch (e) {}
        setTimeout(() => { location.reload(); }, 300);
      });
    })();

    (function() {
      const root = document.documentElement;
      const hamburger = document.getElementById('hamburgerBtn');
      const sidebar = document.getElementById('appSidebar');
      const backdrop = document.getElementById('vySideBackdrop');
      const isMedia = () => root.classList.contains('vy-media');
      // 1280px 以上 (動画ページ以外) は押し出し、それ以外は上に重ねて表示
      const isPush = () => window.innerWidth >= 1280 && !isMedia();
      function setOpen(open) {
        root.classList.toggle('vy-side-open', open);
        if (hamburger) hamburger.setAttribute('aria-expanded', open ? 'true' : 'false');
        setTimeout(function() { window.dispatchEvent(new Event('resize')); }, 320);
      }
      if (hamburger) hamburger.addEventListener('click', function() {
        const open = !root.classList.contains('vy-side-open');
        setOpen(open);
        if (isPush()) {
          try { localStorage.setItem('vy-side-collapsed', open ? '0' : '1'); } catch (e) {}
        }
      });
      if (backdrop) backdrop.addEventListener('click', function() { setOpen(false); });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && root.classList.contains('vy-side-open') && !isPush()) setOpen(false);
      });
      // 重ねて表示しているときは、項目を押したら閉じる
      sidebar.addEventListener('click', function(e) {
        if (e.target.closest('a') && !isPush()) root.classList.remove('vy-side-open');
      });

      // サイドバーの上でスクロールしたときは、サイドバーの中だけを動かす
      // (端まで来たときに後ろのページへスクロールが伝わったり、引っ張って更新が反応したりして、
      //  上のヘッダーからサイドバーだけ引き離されたように見えるのを防ぐ)
      (function() {
        const nav = sidebar.querySelector('.sidebar-nav');
        if (!nav) return;
        const expanded = () => root.classList.contains('vy-side-open');
        const blocked = (dy) => {
          const max = nav.scrollHeight - nav.clientHeight;
          if (max <= 1) return true;
          if (dy < 0) return nav.scrollTop <= 0;
          if (dy > 0) return nav.scrollTop >= max - 1;
          return false;
        };
        sidebar.addEventListener('wheel', function(e) {
          if (!expanded() || e.ctrlKey) return;
          e.stopPropagation();
          if (blocked(e.deltaY)) e.preventDefault();
        }, { passive: false });
        let ty = 0;
        sidebar.addEventListener('touchstart', function(e) {
          if (!expanded() || !e.touches[0]) return;
          ty = e.touches[0].clientY;
          e.stopPropagation();
        }, { passive: true });
        sidebar.addEventListener('touchmove', function(e) {
          if (!expanded() || !e.touches[0]) return;
          const y = e.touches[0].clientY;
          const dy = ty - y;   // 指を上へ動かす = 下へスクロール
          e.stopPropagation();
          if (e.cancelable && blocked(dy)) e.preventDefault();
          ty = y;
        }, { passive: false });
        sidebar.addEventListener('touchend', function(e) { if (expanded()) e.stopPropagation(); }, { passive: true });
      })();

      // ミニメニュー (アイコンだけ) 用に、名前をツールチップに
      sidebar.querySelectorAll('.vy-side-item').forEach(function(a) {
        const b = a.querySelector('.vy-side-txt b');
        if (b && !a.title) { a.title = b.textContent.trim(); a.setAttribute('aria-label', b.textContent.trim()); }
      });

      // active menu item
      const active = sidebar.dataset.active || '';
      const tab = new URLSearchParams(location.search).get('tab') || '';
      let key = active;
      if (active === 'library') key = 'library';
      if (document.body.classList.contains('page-history')) key = 'history';
      if (document.body.classList.contains('page-subscriptions')) key = 'subs';
      if (document.body.classList.contains('page-shorts')) key = 'shorts';
      const el = sidebar.querySelector('[data-nav="' + key + '"]');
      if (el) el.classList.add('active');
      const bn = document.querySelector('.vy-bottom-nav [data-bnav="' + key + '"]');
      if (bn) bn.classList.add('active');

      // 登録チャンネル (本家のようにサイドバーに並べる)
      try {
        const subs = (typeof getSubscriptions === 'function') ? getSubscriptions() : [];
        const box = document.getElementById('vySideSubs');
        if (box && subs.length) {
          const esc = function(t) { return (typeof escapeHtml === 'function') ? escapeHtml(t || '') : String(t || ''); };
          const max = 7;
          let html = '<div class="vy-side-sep"></div><div class="vy-side-label">登録チャンネル</div>';
          subs.slice(0, max).forEach(function(c) {
            const th = c.authorThumbnails && c.authorThumbnails.length ? c.authorThumbnails[0].url : '';
            const icon = th ? ((typeof wsrv === 'function') ? wsrv(th.startsWith('//') ? 'https:' + th : th, 48) : th) : '';
            html += '<a class="sidebar-nav-link vy-side-item vy-side-sub" href="/channel?id=' + encodeURIComponent(c.authorId) + '" title="' + esc(c.author) + '">' +
              '<span class="vy-side-ic">' + (icon ? '<img src="' + icon + '" alt="" loading="lazy" />' : '<i>' + esc((c.author || '?').slice(0, 1)) + '</i>') + '</span>' +
              '<span class="vy-side-txt"><b>' + esc(c.author) + '</b></span></a>';
          });
          if (subs.length > max) html += '<a class="sidebar-nav-link vy-side-item vy-side-sub vy-side-more" href="/library?tab=subs"><span class="vy-side-ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span><span class="vy-side-txt"><b>すべて表示 (' + subs.length + ')</b></span></a>';
          box.innerHTML = html;
          box.hidden = false;
        }
      } catch (e) {}

      // サイドバーのスクロール位置を、画面を切り替えても保つ
      (function() {
        const nav = sidebar.querySelector('.sidebar-nav');
        if (!nav) return;
        const KEY = 'vy-side-scroll';
        const restore = function() {
          let y = 0;
          try { y = parseInt(sessionStorage.getItem(KEY) || '0', 10) || 0; } catch (e) {}
          if (y > 0) nav.scrollTop = y;
        };
        restore();
        let t = 0;
        nav.addEventListener('scroll', function() {
          clearTimeout(t);
          t = setTimeout(function() { try { sessionStorage.setItem(KEY, String(Math.round(nav.scrollTop))); } catch (e) {} }, 80);
        }, { passive: true });
        const save = function() { try { sessionStorage.setItem(KEY, String(Math.round(nav.scrollTop))); } catch (e) {} };
        sidebar.addEventListener('click', save, true);
        window.addEventListener('pagehide', save);
        // 開いたとき (非表示の間はスクロール位置が反映されないことがある) にも戻す
        if (hamburger) hamburger.addEventListener('click', function() { requestAnimationFrame(restore); });
      })();

      // 検索欄の × ボタン
      const si = document.getElementById('searchInput');
      const sc = document.getElementById('searchClearBtn');
      if (si && sc) {
        const sync = function() { sc.hidden = !si.value; };
        si.addEventListener('input', sync);
        sc.addEventListener('click', function() { si.value = ''; sync(); si.focus(); si.dispatchEvent(new Event('input')); });
        setTimeout(sync, 0);
        setTimeout(sync, 600);
      }
    })();

    (function() {
      const root = document.documentElement;
      const btn = document.getElementById('vyThemeBtn');
      if (!btn) return;
      function sync() {
        const light = root.getAttribute('data-theme') === 'light';
        btn.setAttribute('title', light ? 'ライトテーマ（クリックでダーク）' : 'ダークテーマ（クリックでライト）');
        const m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', light ? '#f4f6fb' : '#0b1020');
      }
      sync();
      btn.addEventListener('click', function() {
        const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        root.classList.add('vy-theme-anim');
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('vy-theme', next); } catch (e) {}
        sync();
        setTimeout(function() { root.classList.remove('vy-theme-anim'); }, 400);
      });
    })();

  </script>
</body>
</html>
